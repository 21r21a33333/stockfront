[package]
name = "glider-api"
version = "0.1.0"
authors = ["developers@glider.fi"]
description = "The Glider V2 API is a REST surface for integrator partners to create rebalance strategies, enroll end-users into them, and monitor or withdraw the resulting portfolios.  **Mental model.** A *strategy* is a reusable template (allocation + schedule + swap preferences). A *portfolio* is one end-user's mirror of a strategy with one smart account per chain. Every portfolio enrolled in a strategy mirrors the same allocation; publishing a new strategy version causes enrolled portfolios to re-target on their next scheduled rebalance.  **Rebalances.** Each portfolio runs on the strategy's schedule (`hourly`/`daily`/`weekly`/`monthly`). Integrators can also dispatch an out-of-band run with `POST /v2/portfolios/{id}/rebalance` — useful when an end-user wants to capture or hedge market volatility without waiting for the next tick. Runtime visibility (`nextDueAt`, `lastRebalanceAt`) lives on `GET /v2/portfolios/{id}` under `schedule`, not on the strategy.  **Asset coverage.** Allocations accept any CAIP-19 asset Glider supports — ERC-20 tokens, SPL tokens, and tokenized real-world assets (equities, treasuries) sourced through Glider's upstream data providers. Token metadata, balances, and USD prices are returned uniformly via `GET /v2/portfolios/{id}/positions`.  **Chain abstraction.** Glider's wallet infrastructure handles cross-chain deposit routing and asset migrations between supported chains. Integrators do not need to plan for client-side migrations when a chain is sunset or a strategy moves liquidity venues.  **Conventions.** Authentication uses API keys (`x-api-key` header) with per-scope access. All identifiers are CAIP-10/CAIP-19 so the same shape works across EVM and non-EVM chains. All monetary values are decimal strings — never numbers — to preserve precision across JSON round-trips.  **Terms.** Use of this API is governed by Glider's B2B API terms (see `termsOfService`). Integrators are responsible for surfacing applicable terms to their own end-users."
license = "Proprietary"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
serde_path_to_error = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }
reqwest-middleware = { version = "^0.5", features = ["json", "multipart", "query", "form"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
