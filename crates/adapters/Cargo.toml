[package]
name = "stockfront-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alloy-primitives = "1.7.3"
async-trait = "0.1.89"
axum = "0.8.6"
base64 = "0.22.1"
binance-web3-rwa = { path = "../binance-web3-rwa" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
hmac = "0.12.1"
http = "1.3.1"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls"] }
reqwest-middleware = "0.5.2"
rust_decimal = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
stockfront-core = { path = "../core" }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["rt", "sync"] }
uuid = { version = "1.18.1", features = ["v4"] }
zeroize = "1.8.2"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt"] }

[lints]
workspace = true
