[package]
name = "stockfront-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alloy = { version = "2.5.0", default-features = false, features = ["contract", "provider-http", "reqwest-rustls-tls"] }
alloy-primitives.workspace = true
async-trait.workspace = true
axum.workspace = true
base64 = "0.22.1"
binance-web3-rwa = { path = "../binance-web3-rwa" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
hmac = "0.12.1"
http = "1.3.1"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = "0.5.2"
rust_decimal.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10.9"
stockfront-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true, features = ["v4"] }
venus-api = { path = "../venus-api" }
zeroize = "1.8.2"
url = "2.5.7"

[dev-dependencies]
alloy = { version = "2.5.0", default-features = false, features = ["contract", "provider-http", "reqwest-rustls-tls", "rpc-types", "signer-local"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
