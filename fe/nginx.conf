server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app calls the API on its own origin under /api, as the Vite dev
    # proxy does, so the backend stays private and needs no CORS.
    location /api/ {
        proxy_pass http://backend:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Composing a strategy waits on the AI model for up to a minute.
        proxy_read_timeout 90s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
