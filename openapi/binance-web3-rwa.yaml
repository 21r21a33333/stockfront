openapi: 3.0.3
info:
  title: Binance Web3 API compatibility subset
  version: 1.0.0-stockfront.1
  description: >-
    Stockfront's narrow generated-client contract for the Binance Web3
    endpoints used by its bStock vertical slices.
  x-stockfront-upstream:
    schema: https://web3.binance.com/en/dev-docs/catalog/web3-wallet/api/rest-api/1.0.0/schema.json
    document-version: 1.0.0
  license:
    name: MIT
servers:
  - url: https://web3.binance.com/build
tags:
  - name: RWA data
  - name: Wallet
  - name: Trading
  - name: DeFi data
  - name: DeFi transaction
  - name: Transaction
paths:
  /api/v1/defi/data/investment/list:
    post:
      operationId: listDefiInvestments
      tags: [DeFi data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDefiInvestmentsRequest'
      responses:
        '200':
          description: Matching DeFi investments or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDefiInvestmentsResponse'
  /api/v1/defi/data/investment/detail:
    post:
      operationId: getDefiInvestmentDetail
      tags: [DeFi data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDefiInvestmentDetailRequest'
      responses:
        '200':
          description: DeFi investment detail or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefiInvestmentDetailResponse'
  /api/v1/defi/data/position/list:
    post:
      operationId: getDefiPositions
      tags: [DeFi data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDefiPositionsRequest'
      responses:
        '200':
          description: DeFi positions or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefiPositionsResponse'
  /api/v1/defi/transaction/deposit:
    post:
      operationId: buildDefiDepositTransaction
      tags: [DeFi transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDefiDepositRequest'
      responses:
        '200':
          description: Ordered unsigned deposit transactions or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDefiDepositResponse'
  /api/v1/defi/transaction/lp-add/calculate:
    post:
      operationId: calculateLpAddPairedAmounts
      tags: [DeFi transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateLpAddPairedAmountsRequest'
      responses:
        '200':
          description: Required paired token amount or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateLpAddPairedAmountsResponse'
  /api/v1/defi/transaction/lp-add:
    post:
      operationId: buildLpAddTransaction
      tags: [DeFi transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildLpAddRequest'
      responses:
        '200':
          description: Ordered unsigned LP-add transactions or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLpAddResponse'
  /api/v1/defi/transaction/redeem:
    post:
      operationId: buildDefiRedeemTransaction
      tags: [DeFi transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDefiRedeemRequest'
      responses:
        '200':
          description: Ordered unsigned redemption transactions or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDefiRedeemResponse'
  /api/v1/defi/transaction/claim:
    post:
      operationId: buildDefiClaimTransaction
      tags: [DeFi transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDefiClaimRequest'
      responses:
        '200':
          description: Ordered unsigned claim transactions or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDefiClaimResponse'
  /api/v1/dex/balance/token-balances-by-address:
    post:
      operationId: getTokenBalancesByAddress
      tags: [Wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTokenBalancesByAddressRequest'
      responses:
        '200':
          description: Requested token balances or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenBalancesByAddressResponse'
  /api/v1/dex/market/rwa/tokens:
    get:
      operationId: getRwaTokenList
      tags: [RWA data]
      parameters:
        - $ref: '#/components/parameters/BinanceChainIdOptional'
        - $ref: '#/components/parameters/PlatformId'
        - name: tabId
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: RWA token list or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RwaTokenListResponse'
  /api/v1/dex/market/rwa/price:
    get:
      operationId: getRwaTokenPrice
      tags: [RWA data]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - name: tokenContractAddresses
          in: query
          required: true
          description: Comma-separated token contract addresses, with at most 100 entries.
          schema:
            type: string
      responses:
        '200':
          description: Token prices or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RwaTokenPriceResponse'
  /api/v1/dex/market/rwa/underlying-profile:
    get:
      operationId: getRwaUnderlyingInfo
      tags: [RWA data]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - $ref: '#/components/parameters/TokenContractAddress'
      responses:
        '200':
          description: Underlying profile or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RwaUnderlyingInfoResponse'
  /api/v1/dex/market/rwa/underlying-market:
    get:
      operationId: getRwaUnderlyingMarketData
      tags: [RWA data]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - $ref: '#/components/parameters/TokenContractAddress'
      responses:
        '200':
          description: Underlying market data or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RwaUnderlyingMarketDataResponse'
  /api/v1/dex/aggregator/quote:
    get:
      operationId: getAggregatedQuote
      tags: [Trading]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - name: amount
          in: query
          required: true
          schema:
            type: string
        - name: fromTokenAddress
          in: query
          required: true
          schema:
            type: string
        - name: toTokenAddress
          in: query
          required: true
          schema:
            type: string
        - name: userWalletAddress
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aggregated executable routes or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAggregatedQuoteResponse'
  /api/v1/dex/aggregator/approve-transaction:
    get:
      operationId: getErc20ApproveTransaction
      tags: [Trading]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - name: tokenContractAddress
          in: query
          required: true
          schema:
            type: string
        - name: approveAmount
          in: query
          required: true
          schema:
            type: string
        - name: vendor
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exact ERC-20 approval calldata or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetErc20ApproveTransactionResponse'
  /api/v1/dex/aggregator/swap:
    get:
      operationId: buildSwapTransaction
      tags: [Trading]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - name: amount
          in: query
          required: true
          schema:
            type: string
        - name: fromTokenAddress
          in: query
          required: true
          schema:
            type: string
        - name: toTokenAddress
          in: query
          required: true
          schema:
            type: string
        - name: userWalletAddress
          in: query
          required: true
          schema:
            type: string
        - name: quoteId
          in: query
          required: true
          schema:
            type: string
        - name: slippagePercent
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: On-chain transaction or RFQ signing payload, or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildSwapTransactionResponse'
  /api/v1/dex/aggregator/order/submit:
    post:
      operationId: submitRfqOrder
      tags: [Trading]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRfqOrderRequest'
      responses:
        '200':
          description: Submitted RFQ order or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitRfqOrderResponse'
  /api/v1/dex/aggregator/order/{orderId}:
    get:
      operationId: getRfqOrderStatus
      tags: [Trading]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current RFQ order status or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRfqOrderStatusResponse'
  /api/v1/dex/aggregator/history:
    get:
      operationId: getTransactionStatus
      tags: [Trading]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - name: txHash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current on-chain transaction status or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionStatusResponse'
  /api/v1/dex/post-transaction/transaction-detail-by-txhash:
    get:
      operationId: getTransactionDetailByHash
      tags: [Wallet]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
        - name: txHash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: On-chain transaction details or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionDetailByHashResponse'
  /api/v1/dex/pre-transaction/gas-price:
    get:
      operationId: getGasPrice
      tags: [Transaction]
      parameters:
        - $ref: '#/components/parameters/BinanceChainId'
      responses:
        '200':
          description: Current chain gas prices or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGasPriceResponse'
  /api/v1/dex/pre-transaction/gas-limit:
    post:
      operationId: getGasLimit
      tags: [Transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmPreTransactionRequest'
      responses:
        '200':
          description: Estimated transaction gas limit or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGasLimitResponse'
  /api/v1/dex/pre-transaction/simulate:
    post:
      operationId: simulateTransaction
      tags: [Transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvmPreTransactionRequest'
      responses:
        '200':
          description: Predicted transaction result or a Binance business error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateTransactionResponse'
components:
  parameters:
    BinanceChainId:
      name: binanceChainId
      in: query
      required: true
      schema:
        type: string
    BinanceChainIdOptional:
      name: binanceChainId
      in: query
      required: false
      schema:
        type: string
    PlatformId:
      name: platformId
      in: query
      required: false
      schema:
        type: string
        enum: [ondo, bstock]
    TokenContractAddress:
      name: tokenContractAddress
      in: query
      required: true
      schema:
        type: string
  schemas:
    EvmPreTransactionRequest:
      type: object
      required: [binanceChainId, evmTx]
      properties:
        binanceChainId:
          type: string
        evmTx:
          $ref: '#/components/schemas/EvmTransaction'
    EvmTransaction:
      type: object
      required: [from, to, value, data]
      properties:
        from:
          type: string
        to:
          type: string
        value:
          type: string
        data:
          type: string
    GetGasPriceResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GasPrice'
    GasPrice:
      type: object
      properties:
        evmLegacyGasPrice:
          $ref: '#/components/schemas/EvmLegacyGasPrice'
    EvmLegacyGasPrice:
      type: object
      properties:
        lowGasPrice:
          type: string
        mediumGasPrice:
          type: string
        highGasPrice:
          type: string
    GetGasLimitResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GasLimit'
    GasLimit:
      type: object
      properties:
        gasLimit:
          type: string
    SimulateTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SimulationResult'
    SimulationResult:
      type: object
      properties:
        status:
          type: string
        failReason:
          type: string
          nullable: true
    ListDefiInvestmentsRequest:
      type: object
      required: [investType]
      properties:
        investType:
          type: string
          description: DeFi investment category.
          enum: [Earn, LiquidityPool]
        defiProtocolId:
          type: string
        tokenAddressList:
          type: array
          items:
            type: string
        binanceChainId:
          type: string
        sortField:
          type: string
          description: Supported investment sort field.
          enum: [tvl, apy]
        sortDirection:
          type: string
          description: Investment sort direction.
          enum: [ASC, DESC]
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    ListDefiInvestmentsResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiInvestmentPage'
    DefiInvestmentPage:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/DefiInvestment'
    DefiInvestment:
      type: object
      properties:
        investmentId:
          type: string
    GetDefiInvestmentDetailRequest:
      type: object
      required: [investmentId]
      properties:
        investmentId:
          type: string
    GetDefiInvestmentDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiInvestmentDetail'
    DefiInvestmentDetail:
      type: object
      properties:
        binanceChainId:
          type: string
        defiProtocolId:
          type: string
        protocolName:
          type: string
        protocolLogo:
          type: string
        investmentId:
          type: string
        investmentName:
          type: string
        investType:
          type: string
        investable:
          type: boolean
        apyBps:
          type: integer
          format: int64
        apyDisplay:
          type: string
        apyType:
          type: string
        tvl:
          type: string
        poolAddress:
          type: string
        feeRate:
          type: string
        assetTokenList:
          type: array
          items:
            $ref: '#/components/schemas/DefiInvestmentToken'
    DefiInvestmentToken:
      type: object
      properties:
        tokenAddress:
          type: string
        tokenSymbol:
          type: string
    BuildDefiDepositRequest:
      type: object
      required: [address, investmentId, token]
      properties:
        address:
          type: string
        investmentId:
          type: string
        token:
          $ref: '#/components/schemas/DefiTokenAmount'
        simulate:
          type: boolean
    DefiTokenAmount:
      type: object
      required: [tokenAddress, amount]
      properties:
        tokenAddress:
          type: string
        amount:
          type: string
    BuildDefiDepositResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiTransactionPlan'
    CalculateLpAddPairedAmountsRequest:
      type: object
      required: [address, investmentId, inputToken]
      properties:
        address:
          type: string
        investmentId:
          type: string
        inputToken:
          $ref: '#/components/schemas/DefiTokenAmount'
        priceRange:
          type: string
    CalculateLpAddPairedAmountsResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LpAddPairedAmounts'
    LpAddPairedAmounts:
      type: object
      required: [outputs, poolInfo]
      properties:
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/DefiTokenAmount'
        poolInfo:
          $ref: '#/components/schemas/LpPoolInfo'
    LpPoolInfo:
      type: object
      required: [tickLower, tickUpper]
      properties:
        tickLower:
          type: string
        tickUpper:
          type: string
    BuildLpAddRequest:
      type: object
      required: [address, investmentId, tokenList]
      properties:
        address:
          type: string
        investmentId:
          type: string
        tokenList:
          type: array
          items:
            $ref: '#/components/schemas/DefiTokenAmount'
        tickLower:
          type: string
        tickUpper:
          type: string
        priceRange:
          type: string
        slippageBps:
          type: string
        simulate:
          type: boolean
    BuildLpAddResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiTransactionPlan'
    BuildDefiRedeemRequest:
      type: object
      required: [address, investmentId]
      properties:
        address:
          type: string
        investmentId:
          type: string
        token:
          $ref: '#/components/schemas/DefiTokenAmount'
        simulate:
          type: boolean
    BuildDefiRedeemResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiTransactionPlan'
    BuildDefiClaimRequest:
      type: object
      required: [address, claimType, investmentId, redemptionId]
      properties:
        address:
          type: string
        claimType:
          type: string
          description: Type of claim to prepare.
          enum: [REDEMPTION]
        investmentId:
          type: string
        redemptionId:
          type: string
        simulate:
          type: boolean
    BuildDefiClaimResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiTransactionPlan'
    DefiTransactionPlan:
      type: object
      properties:
        dataList:
          type: array
          items:
            $ref: '#/components/schemas/DefiTransaction'
        preview:
          $ref: '#/components/schemas/DefiTransactionPreview'
        redeemDelayDays:
          type: array
          items:
            type: string
    DefiTransaction:
      type: object
      properties:
        callDataType:
          type: string
          description: Ordered on-chain action represented by this transaction.
          enum: [APPROVE, DEPOSIT, REDEEM, LP_ADD, LP_REMOVE, CLAIM]
        from:
          type: string
        to:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        data:
          type: string
        gasLimit:
          type: string
          nullable: true
        gasPrice:
          type: string
          nullable: true
        maxPriorityFeePerGas:
          type: string
          nullable: true
        maxFeePerGas:
          type: string
          nullable: true
    DefiTransactionPreview:
      type: object
      properties:
        balanceChange:
          type: array
          items:
            $ref: '#/components/schemas/DefiBalanceChange'
        feeAndContract:
          $ref: '#/components/schemas/DefiFeeAndContract'
        healthFactor:
          $ref: '#/components/schemas/DefiHealthFactor'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DefiWarning'
    DefiFeeAndContract:
      type: object
      properties:
        estimatedNetworkFee:
          $ref: '#/components/schemas/DefiNetworkFee'
        interactWith:
          $ref: '#/components/schemas/DefiContract'
    DefiContract:
      type: object
      properties:
        address:
          type: string
    DefiBalanceChange:
      type: object
      properties:
        tokenSymbol:
          type: string
        tokenAddress:
          type: string
        amount:
          type: string
        valueUsd:
          type: string
          nullable: true
    DefiNetworkFee:
      type: object
      properties:
        amount:
          type: string
          nullable: true
        tokenSymbol:
          type: string
        valueUsd:
          type: string
          nullable: true
    DefiHealthFactor:
      type: object
      properties:
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
    DefiWarning:
      type: object
      properties:
        code:
          type: string
        level:
          type: string
        message:
          type: string
    GetTransactionDetailByHashResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TransactionDetail'
    TransactionDetail:
      type: object
      properties:
        height:
          type: string
        txTime:
          type: string
        txhash:
          type: string
        txStatus:
          type: string
    GetDefiPositionsRequest:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          maxItems: 3
          items:
            type: string
        binanceChainIds:
          type: array
          items:
            type: string
    GetDefiPositionsResponse:
      allOf:
        - $ref: '#/components/schemas/BusinessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DefiPositions'
    DefiPositions:
      type: object
      properties:
        totalValue:
          type: string
        addressList:
          type: array
          items:
            $ref: '#/components/schemas/DefiAddressPosition'
    DefiAddressPosition:
      type: object
      properties:
        protocolList:
          type: array
          items:
            $ref: '#/components/schemas/DefiProtocolPosition'
    DefiProtocolPosition:
      type: object
      properties:
        binanceChainId:
          type: string
        defiProtocolId:
          type: string
        protocolName:
          type: string
        protocolTotalValue:
          type: string
        poolList:
          type: array
          items:
            $ref: '#/components/schemas/DefiPoolPosition'
    DefiPoolPosition:
      type: object
      properties:
        poolCa:
          type: string
        positionCollectionList:
          type: array
          items:
            $ref: '#/components/schemas/DefiPositionCollection'
    DefiPositionCollection:
