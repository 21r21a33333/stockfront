[workspace]
members = [
    "crates/adapters",
    "crates/app",
    "crates/binance-web3-rwa",
    "crates/core",
    "crates/glider-api",
    "crates/venus-api",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alloy-primitives = "1.7.3"
async-trait = "0.1.89"
axum = "0.8.6"
rust_decimal = "1.39.0"
serde = "1.0.228"
stockfront-core = { path = "crates/core" }
thiserror = "2.0.17"
tokio = "1.47.1"
uuid = "1.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
